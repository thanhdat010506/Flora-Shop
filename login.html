<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Đăng nhập - Flora Shop</title>
<link rel="stylesheet" href="assets/css/styles.css">
<script defer src="assets/js/main.js"></script>
</head>
<body>
<header class="header"><div class="logo">🌿 Flora Shop</div></header>
<main class="container">
  <form id="loginForm">
    <h2>Đăng nhập</h2>
    <input id="username" placeholder="Tên đăng nhập" required />
    <input id="password" type="password" placeholder="Mật khẩu" required />
    <div style="display:flex;gap:8px;">
      <button class="btn" type="submit">Đăng nhập</button>
      <a href="register.html" class="btn ghost">Đăng ký</a>
    </div>
  </form>
</main>
<script>
(function seedUsers(){
  if(!localStorage.getItem('users_seed_v7')){
    const users = [
      { id:'u_admin', username:'admin', password:'123456', role:'admin', fullName:'Quản trị' },
      { id:'u_user', username:'user', password:'123456', role:'user', fullName:'Khách Demo' }
    ];
    localStorage.setItem('users', JSON.stringify(users));
    localStorage.setItem('users_seed_v7','ok');
  }
})();
document.getElementById('loginForm').addEventListener('submit', e=>{
  e.preventDefault();
  const u=document.getElementById('username').value.trim();
  const p=document.getElementById('password').value.trim();
  const users=JSON.parse(localStorage.getItem('users')||'[]');
  const found=users.find(x=>x.username===u&&x.password===p);
  if(!found){ alert('Sai tài khoản'); return; }
  localStorage.setItem('currentUser', JSON.stringify(found));
  if(found.role==='admin'){ localStorage.setItem('isAdmin','true'); location.href='admin/dashboard.html'; }
  else location.href='index.html';
});
</script>
</body>
</html>
