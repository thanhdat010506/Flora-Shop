<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Đăng nhập - Flora Shop</title>
<link rel="stylesheet" href="assets/css/styles.css">
<script defer src="assets/js/main.js"></script>
</head>
<body>
<header class="header"><div class="logo">🌿 Flora Shop</div></header>

<main class="container">
  <form id="loginForm">
    <h2>Đăng nhập</h2>
    <input id="username" placeholder="Tên đăng nhập" required />
    <input id="password" type="password" placeholder="Mật khẩu" required />
    <div style="display:flex;gap:8px;">
      <button class="btn" type="submit">Đăng nhập</button>
      <a href="register.html" class="btn ghost">Đăng ký</a>
    </div>
  </form>
</main>
<script>
  
document.addEventListener('DOMContentLoaded', () => {
  if (!localStorage.getItem('users_seed_v7')) {
    const users = [
      { id: 'u_admin', username: 'admin123', password: '123456', role: 'admin', fullName: 'Quản trị viên' },
      { id: 'u_user', username: 'user123', password: '123456', role: 'user', fullName: 'Khách hàng Demo' }
    ];
    localStorage.setItem('users', JSON.stringify(users));
    localStorage.setItem('users_seed_v7', 'ok');
  }

  const form = document.getElementById('loginForm');
  form.addEventListener('submit', (e) => {
    e.preventDefault();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!username || !password) {
      alert('Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu!');
      return;
    }

    const users = JSON.parse(localStorage.getItem('users') || '[]');
    const found = users.find(u => u.username === username && u.password === password);

    if (!found) {
      alert('Sai tên đăng nhập hoặc mật khẩu!');
      return;
    }

    localStorage.setItem('currentUser', JSON.stringify(found));

    if (found.role === 'admin') {
      localStorage.setItem('isAdmin', 'true');
      location.href = 'admin/dashboard.html';
    } else {
      localStorage.removeItem('isAdmin');
      location.href = 'index.html';
    }
  });
});
document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('loginForm');

  form.addEventListener('submit', e => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    // Lấy danh sách users
    const users = JSON.parse(localStorage.getItem('users') || '[]');
    const found = users.find(u => u.username === username && u.password === password);

    if (!found) {
      alert('Sai tên đăng nhập hoặc mật khẩu!');
      return;
    }

    // ✅ Lưu thông tin người dùng đang đăng nhập
    localStorage.setItem('currentUser', JSON.stringify(found));

    // Nếu là admin → qua dashboard
    if (found.role === 'admin') {
      localStorage.setItem('isAdmin', 'true');
      location.href = 'admin/dashboard.html';
    } else {
      localStorage.removeItem('isAdmin');
      alert('Đăng nhập thành công!');
      location.href = 'index.html';
    }
  });
});

</script>
</body>
</html>
