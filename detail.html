<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chi tiết sản phẩm</title>
  <script src="data.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background: #f8f9fa;
    }
    #detail {
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
      padding: 20px;
      max-width: 600px;
    }
    img {
      border-radius: 10px;
      margin-bottom: 10px;
    }
    button {
      background: #28a745;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #218838;
    }
  </style>
</head>
<body>
  <h2>🌿 Chi tiết sản phẩm</h2>
  <div id="detail"></div>
  <br>
  <a href="cart.html">🛒 Xem giỏ hàng</a> |
  <a href="index.html">← Quay lại</a>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get("id"));
    const product = products.find(p => p.id === id);
    const div = document.getElementById("detail");

    if (!product) {
      div.innerHTML = "<p>Không tìm thấy sản phẩm!</p>";
    } else {
      const info = product.info;
      div.innerHTML = `
        <img src="${product.image}" width="250"><br>
        <h3>${product.name}</h3>
        <p>${product.desc}</p>
        <p><b>Giá: ${product.price.toLocaleString()}đ</b></p>
        <h4>📋 Thông tin chi tiết:</h4>
        <ul>
          <li><b>Ngày nhập:</b> ${info.ngayNhap}</li>
          <li><b>Giống cây:</b> ${info.giongCay}</li>
          <li><b>Tuổi cây:</b> ${info.tuoiCay}</li>
          <li><b>Số lượng trong kho:</b> ${info.soLuongKho}</li>
          <li><b>Tuổi thọ trung bình:</b> ${info.tuoiTho}</li>
        </ul>
        <label>Số lượng: <input type="number" id="qty" value="1" min="1"></label><br><br>
        <button onclick="addToCart()">Thêm vào giỏ hàng</button>
      `;
    }

    function addToCart() {
      const qty = parseInt(document.getElementById("qty").value);
      let cart = JSON.parse(localStorage.getItem("cart") || "[]");
      const exist = cart.find(i => i.id === product.id);
      if (exist) exist.qty += qty;
      else cart.push({ ...product, qty });
      localStorage.setItem("cart", JSON.stringify(cart));
      alert("✅ Đã thêm vào giỏ hàng!");
    }
  </script>
</body>
</html>
