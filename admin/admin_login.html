<!DOCTYPE html>
<html lang="vi">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Admin - Login</title>
<link rel="stylesheet" href="../assets/css/styles.css"></head>
<body>
<main class="container">
  <form id="alogin">
    <h2>Admin Login</h2>
    <input id="auser" placeholder="admin" value="admin"/>
    <input id="apass" placeholder="123456" value="123456" />
    <button class="btn" type="submit">Đăng nhập</button>
  </form>
</main>
<script>
(function ensureAdmin(){
  let users=JSON.parse(localStorage.getItem('users')||'[]');
  if(!users.some(u=>u.username==='admin')) {
    users.push({id:'u_admin',username:'admin',password:'123456',role:'admin',fullName:'Admin'});
    localStorage.setItem('users', JSON.stringify(users));
  }
})();
document.getElementById('alogin').addEventListener('submit', e=>{
  e.preventDefault();
  const u=document.getElementById('auser').value.trim();
  const p=document.getElementById('apass').value.trim();
  const users=JSON.parse(localStorage.getItem('users')||'[]');
  const found=users.find(x=>x.username===u&&x.password===p&&x.role==='admin');
  if(!found){ alert('Sai admin'); return; }
  localStorage.setItem('isAdmin','true'); localStorage.setItem('currentUser', JSON.stringify(found));
  location.href='dashboard.html';
});
</script>
</body>
</html>
