    .main {

    .cards {
      display: flex;

    .card.stat {
      flex: 1;
      background: #ffffff;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      text-align: center;
      transition: .2s;
      border-left: 6px solid #1b5e20;
      position: relative;
    }

    .card.stat:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .card.stat h3 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      color: #2e7d32;
      margin-bottom: 12px;
    }

    .card.stat p {
      font-size: 34px;
      font-weight: 800;
      color: #1b5e20;
      margin: 0;
    }

    /* Icon ở góc card */
    .card-icon {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 40px;
      opacity: 0.17;
      color: #1b5e20;
    }
  </style>

</head>

<script>
if(!localStorage.getItem('isAdmin')) location.href='admin_login.html';

document.getElementById('m_users').textContent =
  JSON.parse(localStorage.getItem('users') || '[]').length;

  JSON.parse(localStorage.getItem('products') || '[]').length;
