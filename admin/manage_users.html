<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flora Admin - Người dùng</title>
  <link rel="stylesheet" href="assets/css/admin.css">
  <script defer src="assets/js/admin.js"></script>
</head>
<body>

<aside class="sidebar">
  <h2>🌿Flora Admin</h2>
  <ul>
    <li><a href="dashboard.html">Tổng quan</a></li>
    <li><a href="manage_products.html">Sản phẩm</a></li>
    <li><a href="manage_users.html" class="active">Người dùng</a></li>
    <li><a href="manage_orders.html">Đơn hàng</a></li>
    <li><a href="#" onclick="logout()">Đăng xuất</a></li>
  </ul>
</aside>

<main class="main">
  <h1>Quản lý người dùng</h1>

  <button id="addUserBtn" class="btn-add">+ Thêm người dùng</button>

  <div class="table-box">
    <table id="ulist">
      <thead>
        <tr>
          <th>Tên</th>
          <th>Email</th>
          <th>Vai trò</th>
          <th style="width:120px;">Hành động</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</main>

<!-- Modal -->
<div id="userModal" class="modal">
  <div class="modal-content">
    <h2 id="modalTitle">Thêm người dùng</h2>

    <label>Tên:</label>
    <input type="text" id="userName">

    <label>Email:</label>
    <input type="email" id="userEmail">

    <label>Vai trò:</label>
    <select id="userRole">
      <option value="user">User</option>
      <option value="admin">Admin</option>
    </select>

    <div class="modal-actions">
      <button id="saveUserBtn" class="btn-primary">Lưu</button>
      <button id="cancelUserBtn" class="btn-cancel">Hủy</button>
    </div>
  </div>
</div>

<script>
function logout() {
  localStorage.removeItem("isAdmin");
  location.href = "admin_login.html";
}
</script>
