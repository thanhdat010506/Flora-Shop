<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Flora Admin - Đơn hàng</title>

  <!-- ✅ đúng đường dẫn CSS -->
  <link rel="stylesheet" href="assets/css/admin.css">
</head>

<body>

<aside class="sidebar">
  <h2>🌿Flora Admin</h2>
  <ul>
    <li><a href="dashboard.html">Tổng quan</a></li>
    <li><a href="manage_products.html">Sản phẩm</a></li>
    <li><a href="manage_users.html">Người dùng</a></li>
    <li><a href="manage_orders.html" class="active">Đơn hàng</a></li>
    <li><a href="#" onclick="logout()">Đăng xuất</a></li>
    
  </ul>
</aside>

<main class="main">
  <h1>Quản lý đơn hàng</h1>

  <table id="orderTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Người đặt</th>
        <th>Ngày</th>
        <th>Tổng tiền</th>
        <th>Trạng thái</th>
        <th>Hành động</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</main>

<!-- ✅ đúng đường dẫn JS -->
<script src="assets/js/admin.js"></script>

<script>
Admin.requireAdmin();

let orders = Admin.getOrders();
const tbody = document.querySelector("#orderTable tbody");

function render() {
  orders = Admin.getOrders();
  if (!orders.length) {
    tbody.innerHTML = '<tr><td colspan="6">Chưa có đơn hàng</td></tr>';
    return;
  }

  tbody.innerHTML = orders.map((o, i) => {
    const total = o.items.reduce((s, it) => s + it.price * it.qty, 0);
    return `
      <tr>
        <td>${o.id}</td>
        <td>${o.name}</td>
        <td>${o.date}</td>
        <td>${total.toLocaleString()}đ</td>
        <td>${o.status}</td>
        <td>
          <button class="btn-edit" onclick="viewDetail(${i})">Xem</button>
          <button class="btn-del" onclick="changeStatus(${i})">Sửa</button>
        </td>
      </tr>`;
  }).join("");
}

function viewDetail(i) {
  const o = orders[i];
  alert(
    `Đơn #${o.id}\nKhách: ${o.name}\nNgày: ${o.date}\nĐịa chỉ: ${o.address}\nThanh toán: ${o.payment}\nTrạng thái: ${o.status}`
  );
}

function changeStatus(i) {
  const newStatus = prompt("Nhập trạng thái mới:", orders[i].status);
  if (!newStatus) return;
  orders[i].status = newStatus;
  Admin.setOrders(orders);
  render();
}

render();
</script>

<script>
function logout() {
  localStorage.removeItem("isAdmin");
  location.href = "admin_login.html";
}
</script>

</body>
</html>
