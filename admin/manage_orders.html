<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Flora Admin - Đơn hàng</title>
  <link rel="stylesheet" href="assets/css/admin.css">
</head>

<body>

<aside class="sidebar">
  <h2><a href="../index.html" class="home-link">🌿 Flora Admin</a></h2>
  <ul>
    <li><a href="dashboard.html">Tổng quan</a></li>
    <li><a href="manage_products.html">Sản phẩm</a></li>
    <li><a href="manage_users.html">Người dùng</a></li>
    <li><a href="manage_orders.html" class="active">Đơn hàng</a></li>
    <li><a href="#" onclick="logout()">Đăng xuất</a></li>
  </ul>
</aside>

<main class="main">
  <h1>Quản lý đơn hàng</h1>

  <div class="revenue-summary">
    <div class="revenue-card">
      <div class="icon">💰</div>
      <div class="info">
        <h3>Tổng doanh thu</h3>
        <p id="revenueValue">0đ</p>
        <span id="orderCount">(0 đơn hàng)</span>
      </div>
    </div>
  </div>

  <table id="orderTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Người đặt</th>
        <th>Ngày</th>
        <th>Tổng tiền</th>
        <th>Trạng thái</th>
        <th>Hành động</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</main>

<script src="assets/js/admin.js"></script>

<script>
Admin.requireAdmin();

let orders = Admin.getOrders();
const tbody = document.querySelector("#orderTable tbody");

function render() {
  orders = Admin.getOrders();

  if (!orders.length) {
    tbody.innerHTML = '<tr><td colspan="6">Chưa có đơn hàng</td></tr>';
    document.getElementById("revenueValue").textContent = "0đ";
    document.getElementById("orderCount").textContent = "(0 đơn hàng)";
    return;
  }

  let totalRevenue = 0;
  orders.forEach(o => {
    const total = o.items.reduce((s, it) => s + it.price * it.qty, 0);
    totalRevenue += total;
  });

  document.getElementById("revenueValue").textContent =
    totalRevenue.toLocaleString() + "đ";

  document.getElementById("orderCount").textContent =
    "(" + orders.length + " đơn hàng)";

  tbody.innerHTML = orders.map((o, i) => {
    const total = o.items.reduce((s, it) => s + it.price * it.qty, 0);
    return `
      <tr>
        <td>${o.id}</td>
        <td>${o.name}</td>
        <td>${o.date}</td>
        <td>${total.toLocaleString()}đ</td>
        <td>${o.status}</td>
        <td>
          <button class="btn-edit" onclick="viewDetail(${i})">Xem</button>
          <button class="btn-edit" onclick="changeStatus(${i})">Sửa</button>
          <button class="btn-del" onclick="deleteOrder(${i})">Xóa</button>
        </td>
      </tr>
    `;
  }).join("");
}

function viewDetail(i) {
  const o = orders[i];
  alert(`Đơn #${o.id}
Khách: ${o.name}
Ngày: ${o.date}
Địa chỉ: ${o.address}
Thanh toán: ${o.payment}
Trạng thái: ${o.status}`);
}

function changeStatus(i) {
  const newStatus = prompt("Nhập trạng thái mới:", orders[i].status);
  if (!newStatus) return;
  orders[i].status = newStatus;
  Admin.setOrders(orders);
  render();
}

function deleteOrder(i) {
  const o = orders[i];
  if (!confirm(`Bạn có chắc muốn XÓA đơn hàng #${o.id} không?`)) return;

  orders.splice(i, 1);
  Admin.setOrders(orders);
  render();
}

render();
</script>


<script>
function logout() {
  localStorage.removeItem("isAdmin");
  location.href = "admin_login.html";
}
</script>

</body>
</html>
