<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Panel | Flora Shop</title>
<link rel="stylesheet" href="../css/admin.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">🌿 Flora Admin</div>
    <nav class="top-actions">
      <button id="btnLogout" class="btn-outline">Đăng xuất</button>
    </nav>
  </header>

  <main class="container">
    <aside class="sidebar">
      <button class="nav-item active" data-tab="dashboard">📊 Tổng quan</button>
      <button class="nav-item" data-tab="products">🪴 Sản phẩm</button>
      <button class="nav-item" data-tab="orders">🧾 Đơn hàng</button>
      <button class="nav-item" data-tab="users">👥 Người dùng</button>
      <button class="nav-item" data-tab="settings">⚙️ Cài đặt</button>
    </aside>

    <section class="content">
      <!-- Dashboard -->
      <div class="tab active" id="tab-dashboard">
        <h2>Tổng quan</h2>
        <div class="cards">
          <div class="stat-card">
            <div class="stat-title">Doanh thu (tháng)</div>
            <div class="stat-value" id="revMonth">₫0</div>
          </div>
          <div class="stat-card">
            <div class="stat-title">Đơn hôm nay</div>
            <div class="stat-value" id="ordersToday">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-title">Sản phẩm đang bán</div>
            <div class="stat-value" id="activeProducts">0</div>
          </div>
        </div>

        <div class="chart-wrap">
          <canvas id="revenueChart"></canvas>
        </div>
      </div>

      <!-- Products -->
      <div class="tab" id="tab-products">
        <div class="split">
          <div>
            <h2>Quản lý sản phẩm</h2>
          </div>
          <div>
            <button id="btnNewProduct" class="btn-primary">+ Thêm sản phẩm</button>
          </div>
        </div>

        <div id="productFormWrap" class="card hidden">
          <h3 id="pfTitle">Thêm sản phẩm</h3>
          <form id="productForm">
            <input type="hidden" id="pId" />
            <label>Tên sản phẩm</label>
            <input id="pName" required />

            <div class="grid-2">
              <div>
                <label>Giá (₫)</label>
                <input id="pPrice" type="number" min="0" step="1000" required />
              </div>
              <div>
                <label>Tồn kho</label>
                <input id="pStock" type="number" min="0" step="1" required />
              </div>
            </div>

            <div class="grid-2">
              <div>
                <label>Loại</label>
                <select id="pCategory" required>
                  <option value="Cây để bàn">Cây để bàn</option>
                  <option value="Cây phong thủy">Cây phong thủy</option>
                  <option value="Hoa tươi">Hoa tươi</option>
                </select>
              </div>
              <div>
                <label>Đang bán?</label>
                <select id="pActive">
                  <option value="true">Có</option>
                  <option value="false">Không</option>
                </select>
              </div>
            </div>

            <label>Ảnh (URL)</label>
            <input id="pImg" placeholder="images/monstera.jpg" />

            <label>Mô tả</label>
            <textarea id="pDesc" rows="3"></textarea>

            <div class="right">
              <button type="button" class="btn-outline" id="btnCancelProduct">Hủy</button>
              <button class="btn-primary">Lưu</button>
            </div>
            <p class="msg" id="pfMsg"></p>
          </form>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Tên</th><th>Loại</th><th>Giá</th><th>Tồn</th><th>TT</th><th></th>
              </tr>
            </thead>
            <tbody id="productTbody"></tbody>
          </table>
        </div>
      </div>

      <!-- Orders -->
      <div class="tab" id="tab-orders">
        <h2>Quản lý đơn hàng</h2>
        <div class="filters">
          <label>Trạng thái</label>
          <select id="orderStatusFilter">
            <option value="">Tất cả</option>
            <option value="pending">Chờ xử lý</option>
            <option value="paid">Đã thanh toán</option>
            <option value="shipping">Đang giao</option>
            <option value="done">Hoàn tất</option>
            <option value="cancelled">Huỷ</option>
          </select>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Mã</th><th>Khách</th><th>Tổng</th><th>Ngày</th><th>TT</th><th></th>
              </tr>
            </thead>
            <tbody id="orderTbody"></tbody>
          </table>
        </div>
      </div>

      <!-- Users -->
      <div class="tab" id="tab-users">
        <h2>Quản lý người dùng</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Tên</th><th>Email</th><th>Vai trò</th><th>Khóa?</th><th></th>
              </tr>
            </thead>
            <tbody id="userTbody"></tbody>
          </table>
        </div>
      </div>

      <!-- Settings -->
      <div class="tab" id="tab-settings">
        <h2>Cài đặt</h2>
        <p>Đây là nơi bạn có thể cấu hình seed data, reset dữ liệu demo…</p>
        <button id="btnSeed" class="btn-outline">⚡ Tạo dữ liệu mẫu</button>
        <button id="btnReset" class="btn-danger">🧹 Xoá sạch dữ liệu</button>
        <p class="msg" id="setMsg"></p>
      </div>
    </section>
  </main>

  <script src="../js/admin.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    Admin.initAdmin();
  });
</script>
</body>
</html>
