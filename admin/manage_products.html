<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý sản phẩm - Flora Admin</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <script defer src="../assets/js/admin.js"></script>
</head>
<body>
  <aside class="sidebar">
      <h2>🌿 Flora Admin</h2>
      <ul>
        <li><a href="dashboard.html">Tổng quan</a></li>
        <li><a href="manage_products.html" class="active">Sản phẩm</a></li>
        <li><a href="manage_users.html">Người dùng</a></li>
        <li><a href="manage_orders.html">Đơn hàng</a></li>
      </ul>
  </aside>
<div class="main">
  <h1>Quản lý sản phẩm</h1>
  <!-- Modal thêm/sửa sản phẩm -->
  <div id="productModal" class="modal">
    <div class="modal-content">
      <h2 id="modalTitle">Thêm sản phẩm</h2>
      <label>Tên sản phẩm:</label>
      <input type="text" id="pname" placeholder="Nhập tên sản phẩm...">

      <label>Giá:</label>
      <input type="number" id="pprice" placeholder="Nhập giá...">

      <label>Link ảnh:</label>
      <input type="text" id="pimage" placeholder="Dán link ảnh vào đây...">

      <label>Mô tả:</label>
      <textarea id="pdesc" placeholder="Nhập mô tả sản phẩm..." rows="3"></textarea>

      <div class="modal-actions">
        <button id="saveProductBtn" class="btn-primary">Lưu</button>
        <button id="cancelProductBtn" class="btn-cancel">Hủy</button>
      </div>
    </div>
  </div>
</body>
</html>
