<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản phẩm - Flora Shop</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script defer src="js/products.js"></script>
    <style>
     /* ======================= */
/*  🌿 FLORA SHOP PRODUCT  */
/* ======================= */

body {
  background: #fdfbf6;
  font-family: 'Quicksand', sans-serif;
  margin: 0;
}

/* HEADER */
.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 30px;
  background:#e9f5ec;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);
}

.logo {
  font-size:22px;
  color:#2f6f3e;
  font-weight:700;
}

.nav ul {
  display:flex;
  gap:25px;
  list-style:none;
}
.nav a {
  text-decoration:none;
  font-weight:600;
  color:#333;
}
.nav a.active, .nav a:hover {
  color:#2f6f3e;
}

.icons a {
  margin-left: 15px;
  color:#2f6f3e;
  font-size:22px;
}

/* TITLE */
.title {
  text-align:center;
  margin:20px 0;
  font-size:25px;
  color:#2f6f3e;
  font-weight:700;
}

/* FILTER */
.filter-bar {
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  padding-bottom:20px;
}
.filter-bar input,
.filter-bar select {
  padding:8px 12px;
  border-radius:8px;
  border:1px solid #ccc;
}

/* PRODUCT GRID */
#product-list {
  max-width:1200px;
  margin:0 auto;
  padding:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));
  gap:25px;
}

.product-card {
  background:white;
  border-radius:16px;
  padding:15px;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);
  transition:0.3s;
}
.product-card:hover {
  transform:translateY(-5px);
}

.product-card img {
  width:100%;
  height:200px;
  border-radius:12px;
  object-fit:cover;
  cursor:pointer;
}

.product-card h3 {
  margin-top:10px;
  font-size:20px;
  color:#2f6f3e;
}

.desc {
  color:#777;
  margin:5px 0;
}

.price {
  color:#d9534f;
  font-weight:700;
}

.add-btn {
  margin-top:10px;
  background:#2f6f3e;
  color:white;
  border:none;
  border-radius:8px;
  padding:8px 12px;
  cursor:pointer;
}
.add-btn:hover {
  background:#47945a;
}

/* PAGINATION */
#pagination {
  text-align:center;
  margin-top:20px;
}

.page-btn {
  background:#e9f5ec;
  border:none;
  padding:8px 14px;
  border-radius:8px;
  margin:3px;
  cursor:pointer;
}

.page-btn.active {
  background:#2f6f3e;
  color:white;
}

.page-btn:hover {
  background:#47945a;
  color:white;
}
    </style>
  </head>
  <body>

    <!-- Header -->
  <header class="header">
    <div class="logo">🌿 Flora Shop</div>
    <nav class="nav">
      <ul>
        <li><a href="index.html" class="active">Trang chủ</a></li>
        <li><a href="products.html">Sản phẩm</a></li>
        <li><a href="about.html">Giới thiệu</a></li>
        <li><a href="contact.html">Liên hệ</a></li>
        <div class="user-info" style="display: unset;">
       <span id="username"></span>
       <button id="logoutBtn"></button>
       </div>
      </ul>

    </nav>
    <div class="icons">
      <span id="cart-count">0</span>
      <a href="cart.html" title="Giỏ hàng" class="fa-solid fa-cart-shopping"></a>
      <a href="login.html" title="Tài khoản" class="fa-regular fa-user"></a>
    </div>
    <div class="menu-toggle">☰</div>
  </header>

    <div class="filter-bar">
      <input id="search" placeholder="Tìm theo tên..." />
      <select id="category">
        <option value>Tất cả loại</option>
        <option value="Hoa">Hoa</option>
        <option value="Cây cảnh">Cây cảnh</option>
      </select>
      <select id="priceRange">
        <option value>Tất cả giá</option>
        <option value="0-100000">Dưới 100.000</option>
        <option value="100000-200000">100.000 - 200.000</option>
        <option value="200000-500000">200.000 - 500.000</option>
        <option value="500000-9999999">Trên 500.000</option>
      </select>
      <button id="filterBtn">Lọc</button>
    </div>

    <div id="product-list"></div>
    <div id="pagination"></div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
        
        document.getElementById('username').textContent = currentUser.username;
        document.getElementById('logoutBtn').addEventListener('click', () => {
          localStorage.removeItem('currentUser'); 
          window.location.href="login.html";
        });

        // 🌸 Dữ liệu sản phẩm mẫu (ảnh JPG)
        const defaultProducts = [
          {id:1,name:'Hoa hồng',category:'Hoa',price:120000,desc:'Hoa hồng đẹp', img:'assets/img/id1.jpg'},
          {id:2,name:'Hoa hướng dương',category:'Hoa',price:90000,desc:'Rạng rỡ tỏa nắng', img:'assets/img/id2.jpg'},
          {id:3,name:'Cây phát tài',category:'Cây cảnh',price:250000,desc:'Mang lại may mắn', img:'assets/img/id3.jpg'},
          {id:4,name:'Hoa tulip',category:'Hoa',price:150000,desc:'Thanh lịch và tinh tế', img:'assets/img/id4.jpg'},
          {id:5,name:'Hoa lan',category:'Hoa',price:200000,desc:'Biểu tượng sang trọng', img:'assets/img/id5.jpg'},
          {id:6,name:'Hoa cúc',category:'Hoa',price:80000,desc:'Đơn giản mà đáng yêu', img:'assets/img/id6.jpg'},
          {id:7,name:'Cây bonsai',category:'Cây cảnh',price:350000,desc:'Nghệ thuật thu nhỏ thiên nhiên', img:'assets/img/id7.jpg'},
          {id:8,name:'Cây sen đá',category:'Cây cảnh',price:100000,desc:'Dễ chăm, bền bỉ', img:'assets/img/id8.jpg'},
          {id:9,name:'Hoa mẫu đơn',category:'Hoa',price:180000,desc:'Sang trọng và quý phái', img:'assets/img/id9.jpg'},
          {id:10,name:'Cây may mắn',category:'Cây cảnh',price:220000,desc:'Mang lại tài lộc', img:'assets/img/id10.jpg'},
          {id:11,name:'Hoa ly',category:'Hoa',price:190000,desc:'Tinh khiết và thanh cao', img:'assets/img/id11.jpg'},
          {id:12,name:'Hoa cẩm tú cầu',category:'Hoa',price:210000,desc:'Ngọt ngào và nhẹ nhàng', img:'assets/img/id12.jpg'}
        ];

        if(!localStorage.getItem('products')) 
          localStorage.setItem('products', JSON.stringify(defaultProducts));

        const list = document.getElementById('product-list');
        const search = document.getElementById('search');
        const category = document.getElementById('category');
        const priceRange = document.getElementById('priceRange');
        const filterBtn = document.getElementById('filterBtn');
        const paginationContainer = document.getElementById('pagination');
        const cartCount = document.getElementById('cart-count');
        const ITEMS_PER_PAGE = 6;
        let currentPage = 1;
        let filteredProducts = JSON.parse(localStorage.getItem('products'));

        function getProductImage(p){
          return p.img || `assets/img/id${p.id}.jpg`;
        }

        function updateCartCount(){
          const key = `cart_${currentUser.username}`;
          const cart = JSON.parse(localStorage.getItem(key) || '[]');
          cartCount.textContent = cart.reduce((s,i)=>s+i.qty,0);
        }

        function addToCart(id){
          const key = `cart_${currentUser.username}`;
          const products = JSON.parse(localStorage.getItem('products'));
          const prod = products.find(p=>p.id===id);
          let cart = JSON.parse(localStorage.getItem(key) || '[]');
          const exist = cart.find(i=>i.id===id);
          if(exist) exist.qty++;
          else cart.push({...prod, qty:1});
          localStorage.setItem(key, JSON.stringify(cart));
          updateCartCount();
          alert(`✅ Đã thêm "${prod.name}" vào giỏ hàng!`);
        }

        function display(products){
          const start = (currentPage-1)*ITEMS_PER_PAGE;
          const end = start+ITEMS_PER_PAGE;
          const items = products.slice(start, end);
          list.innerHTML = items.map(p=>`
            <div class="product-card">
              <img src="${getProductImage(p)}" alt="${p.name}" 
                   onclick="window.location.href='detail.html?id=${p.id}'" 
                   onerror="this.src='assets/img/placeholder.jpg'">
              <h3>${p.name}</h3>
              <p>${p.desc}</p>
              <p class="price">${p.price.toLocaleString()} VNĐ</p>
              <button class="add-btn" data-id="${p.id}">🛒 Thêm vào giỏ</button>
            </div>`).join('');
          document.querySelectorAll('.add-btn').forEach(btn=>btn.addEventListener('click',()=>addToCart(Number(btn.dataset.id))));
          renderPagination(products.length);
        }

        function renderPagination(totalItems){
          const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);
          if(totalPages <= 1) { paginationContainer.innerHTML = ''; return; }
          let html = `<div class="pagination-info">Trang ${currentPage} / ${totalPages} (${totalItems} sản phẩm)</div>`;
          html += '<div class="pagination-buttons">';
          for(let i=1; i<=totalPages; i++){
            html += `<button class="page-btn ${i===currentPage?'active':''}" data-page="${i}">${i}</button>`;
          }
          html += '</div>';
          paginationContainer.innerHTML = html;
          paginationContainer.querySelectorAll('.page-btn').forEach(btn=>btn.addEventListener('click',e=>{
            currentPage = Number(e.target.dataset.page);
            display(filteredProducts);
          }));
        }

        function filterProducts(){
          const all = JSON.parse(localStorage.getItem('products'));
          const kw = (search.value||'').toLowerCase();
          const cat = category.value;
          const price = priceRange.value;
          filteredProducts = all.filter(p=>{
            const matchName = p.name.toLowerCase().includes(kw);
            const matchCat = cat ? p.category===cat : true;
            let matchPrice = true;
            if(price){
              const [min,max] = price.split('-').map(Number);
              matchPrice = p.price >= min && p.price <= max;
            }
            return matchName && matchCat && matchPrice;
          });
          currentPage = 1;
          display(filteredProducts);
        }

        // Lọc khi bấm nút hoặc gõ Enter
        filterBtn.addEventListener('click', filterProducts);
        search.addEventListener('keyup', e => { if(e.key === 'Enter') filterProducts(); });

        display(filteredProducts);
        updateCartCount();
      });
    </script>

  </body>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const userIcon = document.querySelector('.fa-user');
  const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
  
  if (currentUser) {
    if (currentUser.role === 'admin') {
      userIcon.setAttribute('href', 'admin/dashboard.html');
    } else {
      userIcon.setAttribute('href', 'account.html');
    }
    userIcon.setAttribute('title', `Xin chào, ${currentUser.fullName || currentUser.username}`);
  } else {
    userIcon.setAttribute('href', 'login.html');
    userIcon.setAttribute('title', 'Đăng nhập');
  }
});
</script>
</html>
