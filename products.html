<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản phẩm - Flora Shop</title>
    <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #e8f6ef;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .back-btn {
      margin-bottom: 15px;
      text-align: left;
    }
    .back-btn button {
      padding: 8px 16px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .search-section {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .search-section input,
    .search-section select {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    .search-section input { flex: 1; }
    ul {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      padding: 0;
      margin: 0;
    }
    ul li {
      border: 2px solid #4caf50;
      border-radius: 10px;
      padding: 8px 15px;
      cursor: pointer;
      transition: all 0.3s;
      background: white;
      color: #333;
      font-weight: 500;
    }
    ul li:hover,
    ul li.active {
      background: #4caf50;
      color: white;
      transform: scale(1.1);
    }
    .plant-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }
    .plant {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      background: #fafafa;
      transition: transform 0.2s;
    }
    .plant:hover { transform: scale(1.05); }
    .plant img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .pagination {
      text-align: center;
      margin-top: 20px;
    }
    .pagination button {
      padding: 8px 16px;
      border: none;
      background: #4caf50;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      margin: 0 5px;
    }
    .no-result {
      text-align: center;
      color: #888;
      margin-top: 20px;
    }
  </style>
  </head>
  <body>
    <div class="container">
      <!-- Nút quay lại trang chủ -->
      <div class="back-btn">
        <button onclick="window.location.href='index.html'">← Quay lại trang
          chủ</button>
      </div>

      <!-- Tìm kiếm và lọc giá -->
      <div class="search-section">
        <input type="text" id="search" placeholder="Nhập cây cảnh cần tìm..." />
        <select id="price">
          <option value="all">Tất cả giá</option>
          <option value="duoi1">Dưới 1 triệu</option>
          <option value="1den10">1 - 10 triệu</option>
          <option value="tren10">Trên 10 triệu</option>
        </select>
      </div>

      <!-- Danh mục -->
      <ul id="categoryList">
        <li class="active" data-category="tatca">Tất cả</li>
        <li data-category="canh">Cây cảnh</li>
        <li data-category="phongthuy">Phong thủy</li>
        <li data-category="hoatuoi">Hoa tươi</li>
      </ul>

      <!-- Danh sách sản phẩm -->
      <div id="plantContainer" class="plant-list"></div>
      <div id="noResult" class="no-result" style="display:none">Không tìm thấy
        cây phù hợp.</div>

      <!-- Phân trang -->
      <div class="pagination">
        <button id="prev">Trang trước</button>
        <span id="page-info"></span>
        <button id="next">Trang sau</button>
      </div>
    </div>

    <script>
    const products = JSON.parse(localStorage.getItem("products")) || [];

    const plantContainer = document.getElementById("plantContainer");
    const searchInput = document.getElementById("search");
    const priceSelect = document.getElementById("price");
    const categoryList = document.getElementById("categoryList");
    const noResult = document.getElementById("noResult");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");
    const pageInfo = document.getElementById("page-info");

    let currentCategory = "tatca";
    let currentPage = 1;
    const itemsPerPage = 6;

    function filterProducts() {
      if (!products || products.length === 0) {
        plantContainer.innerHTML = "";
        noResult.style.display = "block";
        noResult.textContent = "Hiện chưa có sản phẩm nào trong hệ thống.";
        pageInfo.textContent = "";
        return;
      }

      const keyword = searchInput.value.toLowerCase();
      let filtered = products.filter(p => {
        const matchName = p.name?.toLowerCase().includes(keyword);
        const matchCategory = currentCategory === "tatca" || p.category === currentCategory;
        let matchPrice = true;
        if(priceSelect.value==="duoi1") matchPrice = p.price < 1000000;
        else if(priceSelect.value==="1den10") matchPrice = p.price >= 1000000 && p.price <= 10000000;
        else if(priceSelect.value==="tren10") matchPrice = p.price > 10000000;
        return matchName && matchCategory && matchPrice;
      });

      renderPage(filtered);
    }

    function renderPage(list) {
      const totalPages = Math.ceil(list.length / itemsPerPage);
      if(currentPage>totalPages) currentPage = totalPages || 1;
      const start = (currentPage-1)*itemsPerPage;
      const pageData = list.slice(start, start+itemsPerPage);

      plantContainer.innerHTML = "";
      if(pageData.length === 0){
        noResult.style.display = "block";
        noResult.textContent = "Không tìm thấy cây phù hợp.";
      } else {
        noResult.style.display = "none";
        pageData.forEach(p=>{
          const div = document.createElement("div");
          div.className = "plant";
          div.innerHTML = `
            <img src="${p.img}" alt="${p.name}">
            <h3>${p.name}</h3>
            <p>${p.price.toLocaleString()}đ</p>
            <button onclick="viewDetail(${p.id})">Xem chi tiết</button>
          `;
          plantContainer.appendChild(div);
        });
      }

      pageInfo.textContent = list.length>0 ? `Trang ${currentPage}/${totalPages||1}` : "";
      prevBtn.disabled = currentPage===1;
      nextBtn.disabled = currentPage===totalPages||totalPages===0;
    }

    prevBtn.onclick = () => { if(currentPage>1){ currentPage--; filterProducts(); } };
    nextBtn.onclick = () => { currentPage++; filterProducts(); };

    categoryList.addEventListener("click", e=>{
      if(e.target.tagName==="LI"){
        document.querySelectorAll("#categoryList li").forEach(li=>li.classList.remove("active"));
        e.target.classList.add("active");
        currentCategory = e.target.dataset.category;
        currentPage = 1;
        filterProducts();
      }
    });

    searchInput.oninput = priceSelect.onchange = () => { currentPage=1; filterProducts(); };

    function viewDetail(id){
      localStorage.setItem("selectedProduct", id);
      window.location.href="detail.html";
    }

    filterProducts();
  </script>
  </body>
</html>
