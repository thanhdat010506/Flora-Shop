<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sản phẩm - Flora Shop</title>
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script defer src="assets/js/main.js"></script>
<script defer src="js/products.js"></script>

</head>
<body>
<header class="header">
  <div class="logo">🌿 Flora Shop</div>
  <nav class="nav">
    <ul>
      <li><a href="index.html">Trang chủ</a></li>
      <li><a href="products.html" class="active">Sản phẩm</a></li>
      <li><a href="about.html">Giới thiệu</a></li>
      <li><a href="contact.html">Liên hệ</a></li>
    </ul>
  </nav>
  <div class="icons">
    <a href="cart.html" class="fa-solid fa-cart-shopping"></a>
    <a href="login.html" class="fa-regular fa-user"></a>
  </div>
  <div class="menu-toggle">☰</div>
</header>

<main class="container">
  <h2>Danh sách sản phẩm</h2>

  <div class="filter-bar">
    <input id="search" placeholder="Tìm tên..." />
    <select id="category">
      <option value="">Tất cả loại</option>
      <option value="Hoa">Hoa</option>
      <option value="Cây cảnh">Cây cảnh</option>
    </select>
    <select id="priceRange">
      <option value="">Tất cả giá</option>
      <option value="0-100000">Dưới 100.000</option>
      <option value="100000-200000">100.000 - 200.000</option>
      <option value="200000-500000">200.000 - 500.000</option>
      <option value="500000-9999999">Trên 500.000</option>
    </select>
    <button id="filterBtn">Lọc</button>
  </div>

  <div id="product-list" class="product-grid"></div>
</main>

<footer class="footer">
  <p>© 2025 Flora Shop</p>
</footer>
</body>
</html>
