<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Thanh toán - Flora Shop</title>
<link rel="stylesheet" href="assets/css/styles.css">
<script defer src="assets/js/main.js"></script>
<script defer src="js/checkout.js"></script>
</head>
<body>
<header class="header">
  <div class="logo">🌿 Flora Shop</div>
</header>

<main class="container">
  <h2>Thanh toán</h2>
  
  <div style="text-align:center; margin-bottom:20px;">
    <a href="cart.html" class="btn" style="background:#e9f5ec; color:#2f6f3e; padding:8px 16px; border-radius:8px; text-decoration:none; display:inline-block;">
      ← Quay lại giỏ hàng
    </a>
  </div>
  
  <form id="checkoutForm">
    <input id="c_name" placeholder="Họ tên" required />
    <input id="c_phone" placeholder="Số điện thoại" />
    
    <div class="address-selection">
      <label>Chọn địa chỉ giao hàng:</label>
      <div class="address-options">
        <input type="radio" id="savedAddress" name="addressOption" value="saved" checked>
        <label for="savedAddress">Sử dụng địa chỉ đã lưu</label>
        
        <input type="radio" id="newAddress" name="addressOption" value="new">
        <label for="newAddress">Địa chỉ mới</label>
      </div>
      
      <div id="savedAddressContainer">
        <select id="savedAddressSelect">
          <option value="">Chọn địa chỉ</option>
        </select>
      </div>
      
      <div id="newAddressContainer" style="display:none;">
        <input type="text" id="c_address" placeholder="Nhập địa chỉ mới" />
      </div>
    </div>
    
     <label for="c_payment"><strong>Phương thức thanh toán</strong></label>
      <select id="c_payment" required>
        <option value="cash">Tiền mặt</option>
        <option value="transfer">Chuyển khoản</option>
        <option value="visa">Thẻ Visa / Mastercard</option>
      </select>
      <div id="cardInfo" style="display:none; margin-top:15px; border:1px solid #ccc; padding:15px; border-radius:8px;">

        <h3>Thông tin thẻ</h3>

        <input id="card_number" placeholder="Số thẻ (16 số)" maxlength="16" />
        <input id="card_holder" placeholder="Tên chủ thẻ (IN HOA)" />
        <input id="card_expiry" placeholder="MM/YY" maxlength="5" />
        <input id="card_cvv" placeholder="CVV (3 số)" maxlength="3" />

      </div>

      <button class="btn" type="submit" style="margin-top:20px;">Xác nhận thanh toán</button>
    </form>
</main>

<footer class="footer"><p>© 2025 Flora Shop</p></footer>
</body>

</html>
